name: okanjo

services:
  web:
    build: .
    image: okanjo
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?RAILS_MASTER_KEY が未設定です}
      SOLID_QUEUE_IN_PUMA: "true"
    volumes:
      - storage:/rails/storage
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/up" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  storage:
